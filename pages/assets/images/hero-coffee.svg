<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#heroBg)"/>

  <!-- Decorative circles / lines -->
  <circle cx="400" cy="250" r="210" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="400" cy="250" r="160" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Subtle botanical branch (left) -->
  <path d="M220,380 Q250,280 290,210 T350,150" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round"/>
  <path d="M255,290 C240,270 245,250 265,260 C275,265 270,280 255,290 Z" fill="#333333"/>
  <path d="M295,225 C310,210 325,220 315,235 C305,245 290,235 295,225 Z" fill="#333333"/>
  <path d="M330,175 C320,155 335,145 345,160 C350,170 340,180 330,175 Z" fill="#333333"/>

  <!-- Coffee Saucer -->
  <ellipse cx="400" cy="350" rx="140" ry="24" fill="#222222" stroke="#444444" stroke-width="2"/>
  <ellipse cx="400" cy="346" rx="110" ry="16" fill="#181818"/>

  <!-- Coffee Cup -->
  <path d="M330,230 L470,230 C465,310 440,335 400,335 C360,335 335,310 330,230 Z" fill="url(#cupGrad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Cup Handle -->
  <path d="M465,245 C495,245 500,300 455,305" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M465,245 C490,245 495,296 455,301" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- Coffee Liquid Surface -->
  <ellipse cx="400" cy="232" rx="66" ry="14" fill="#0d0d0d"/>
  <ellipse cx="400" cy="232" rx="55" ry="10" fill="#261b14" stroke="#543825" stroke-width="1"/>
  
  <!-- Steam Curves -->
  <path d="M380,205 Q370,165 385,135 T380,85" fill="none" stroke="#888888" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M405,200 Q420,160 405,125 T415,75" fill="none" stroke="#aaaaaa" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M430,205 Q440,170 425,140 T435,95" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Text / Slogan in SVG -->
  <text x="400" y="420" fill="#ffffff" font-size="20" font-family="'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="4">小歪飲料</text>
  <text x="400" y="448" fill="#888888" font-size="14" font-family="'Noto Sans TC', sans-serif" font-weight="300" text-anchor="middle" letter-spacing="6">讓咖啡，陪你慢下來</text>
</svg>
