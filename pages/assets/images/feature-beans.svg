<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="beanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="8" fill="url(#beanBg)"/>
  <circle cx="200" cy="140" r="95" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left Bean -->
  <g transform="translate(160,135) rotate(-25) scale(0.9)">
    <path d="M0,-45 C30,-45 45,-15 45,15 C45,45 25,55 -5,55 C-35,55 -45,25 -45,-5 C-45,-35 -30,-45 0,-45 Z" fill="#1f1f1f"/>
    <!-- Crease -->
    <path d="M-2,-42 C12,-20 -15,10 0,52" fill="none" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right Bean -->
  <g transform="translate(235,145) rotate(35) scale(0.85)">
    <path d="M0,-45 C30,-45 45,-15 45,15 C45,45 25,55 -5,55 C-35,55 -45,25 -45,-5 C-45,-35 -30,-45 0,-45 Z" fill="#333333"/>
    <!-- Crease -->
    <path d="M-2,-42 C12,-20 -15,10 0,52" fill="none" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Botanical branch accent -->
  <path d="M125,210 Q160,185 200,195 T275,190" fill="none" stroke="#777777" stroke-width="1.5"/>
  <circle cx="140" cy="200" r="3" fill="#555555"/>
  <circle cx="180" cy="190" r="3" fill="#555555"/>
  <circle cx="225" cy="195" r="3" fill="#555555"/>
  <circle cx="265" cy="190" r="3" fill="#555555"/>

  <text x="200" y="260" fill="#222222" font-size="16" font-family="'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="2">精選咖啡豆</text>
</svg>
