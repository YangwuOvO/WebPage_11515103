<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="8" fill="url(#spaceBg)"/>
  <circle cx="200" cy="140" r="95" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Minimalist Window / Light frame -->
  <rect x="145" y="80" width="110" height="75" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="200" y1="80" x2="200" y2="155" stroke="#333333" stroke-width="1.5"/>
  <line x1="145" y1="120" x2="255" y2="120" stroke="#333333" stroke-width="1.5"/>

  <!-- Table and Chair line art -->
  <!-- Chair -->
  <path d="M150,195 L150,165 C150,160 160,160 160,165 L160,195" fill="none" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="145" y1="175" x2="165" y2="175" stroke="#222222" stroke-width="2.5"/>
  
  <!-- Table -->
  <line x1="180" y1="168" x2="225" y2="168" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <line x1="202" y1="168" x2="202" y2="195" stroke="#111111" stroke-width="2.5"/>
  <line x1="190" y1="195" x2="215" y2="195" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small cup on table -->
  <path d="M210,168 L210,162 C210,160 216,160 216,162 L216,168" fill="none" stroke="#555555" stroke-width="1.5"/>

  <!-- Potted plant right side -->
  <path d="M235,195 L245,195 L243,180 L237,180 Z" fill="#444444"/>
  <path d="M240,180 Q240,165 248,160" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M240,175 Q235,168 230,166" fill="none" stroke="#333333" stroke-width="1.5"/>

  <text x="200" y="260" fill="#222222" font-size="16" font-family="'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="2">自在空間</text>
</svg>
